<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      (function () {
        var repoRoot = '/smart-fund-manager';
        var l = window.location;
        var path = l.pathname;
        var query = l.search;
        var hash = l.hash || '';

        if (path.indexOf(repoRoot) === 0) {
          path = path.slice(repoRoot.length) || '/';
        }

        var encodedPath = encodeURIComponent(path).replace(/%26/g, '~and~');
        var encodedQuery = query
          ? encodeURIComponent(query.slice(1)).replace(/%26/g, '~and~')
          : '';

        var redirectUrl =
          repoRoot +
          '/?p=' +
          encodedPath +
          (encodedQuery ? '&q=' + encodedQuery : '') +
          hash;

        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
